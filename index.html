<html lang="vi">
<head>

<meta name="description" content="Biến bộ đề trắc nghiệm thành bài quiz kiểu Quizizz: ôn tập, kiểm tra, lưu lịch sử và đồng bộ bằng tài khoản Google.">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0D0F" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Memora">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Shell: a labelled toolbar on the left (a drawer under 1024px) beside one centred work column.
   One brand blue at full strength only on small marks (the primary button, the data); its pale tint does the area work. */
:root {
  --bg: #F4F5F7; --surface: #FFFFFF; --surface-2: #F1F3F6; --active: #E5E8ED; --line: #E2E5EA; --rule: #ECEEF1; --control: #CBD0D8;
  --ink: #111827; --ink-2: #2B3240; --muted: #586070;
  --accent: #1D5FD6; --accent-ink: #FFFFFF; --accent-soft: #E7EEFC; --accent-deep: #0B3A84;
  --ok: #1F7A4A; --ok-soft: #DDF5E7; --bad: #C4242A; --bad-soft: #FDECEA; --warn: #92400E; --warn-soft: #FEF3D7; --warn-mark: #D98A1C;
  --ai: #0D6E65; --ai-soft: #DCF1EE;
  --t1: #1D5FD6; --t2: #0B8577; --t3: #B76A00; --t4: #BC2F7A;
  --tile-ink: #FFFFFF; --tile-ok: #1F7A4A; --tile-bad: #C4242A;
  --float: 0 12px 32px rgb(17 24 39 / .16), 0 2px 6px rgb(17 24 39 / .08);
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 16px; --r-in: 10px; --side-w: 256px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C0D0F; --surface: #16171A; --surface-2: #1E2024; --active: #272A30; --line: #26292E; --rule: #1F2125; --control: #3B3F46;
  --ink: #F1F2F4; --ink-2: #D7DAE0; --muted: #A7ADB8;
  --accent: #6E9BFF; --accent-ink: #0C0D0F; --accent-soft: #18233A; --accent-deep: #BFD2FF;
  --ok: #4CC38A; --ok-soft: #12291D; --bad: #F07272; --bad-soft: #321A1B; --warn: #F0B44C; --warn-soft: #2D2413; --warn-mark: #E0A040;
  --ai: #52C7B8; --ai-soft: #10282A;
  --tile-ok: #1C7546; --tile-bad: #B5292E;
  --float: 0 12px 32px rgb(0 0 0 / .5), 0 2px 6px rgb(0 0 0 / .3);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0C0D0F; --surface: #16171A; --surface-2: #1E2024; --active: #272A30; --line: #26292E; --rule: #1F2125; --control: #3B3F46;
  --ink: #F1F2F4; --ink-2: #D7DAE0; --muted: #A7ADB8;
  --accent: #6E9BFF; --accent-ink: #0C0D0F; --accent-soft: #18233A; --accent-deep: #BFD2FF;
  --ok: #4CC38A; --ok-soft: #12291D; --bad: #F07272; --bad-soft: #321A1B; --warn: #F0B44C; --warn-soft: #2D2413; --warn-mark: #E0A040;
  --ai: #52C7B8; --ai-soft: #10282A;
  --tile-ok: #1C7546; --tile-bad: #B5292E;
  --float: 0 12px 32px rgb(0 0 0 / .5), 0 2px 6px rgb(0 0 0 / .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { line-height: 1.25; margin: 0; text-wrap: balance; }
h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: -.015em; }
h2 { font-size: 1.08rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .87rem; }
.num { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ico { display: inline-grid; place-items: center; flex: none; width: 18px; height: 18px; }

/* ---------- Shell ---------- */
.wrap { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.canvas { min-width: 0; padding: 28px max(32px, env(safe-area-inset-right, 0px)) 64px 40px; display: flex; flex-direction: column; gap: 20px; }
.canvas > * { width: 100%; max-width: 1040px; margin-inline: auto; }
.wrap.focus { grid-template-columns: minmax(0, 1fr); }
.wrap.focus .side { display: none; }
.wrap.focus .canvas > * { max-width: 1200px; }

/* Toolbar */
.side { position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 20px; padding: calc(18px + env(safe-area-inset-top, 0px)) 12px calc(16px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 0 6px; }
.side-body { display: flex; flex-direction: column; gap: 20px; flex: 1; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px; margin: -4px; border-radius: 10px; color: var(--ink); cursor: pointer; font: inherit; }
.brand b { font-size: 1.2rem; font-weight: 700; letter-spacing: -.01em; }
.mark { width: 30px; height: 30px; border-radius: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 5px; background: var(--surface); border: 1px solid var(--line); }
.mark i { border-radius: 2.5px; display: block; }
.mark i:nth-child(1) { background: var(--t1); } .mark i:nth-child(2) { background: var(--t2); }
.mark i:nth-child(3) { background: var(--t3); } .mark i:nth-child(4) { background: var(--t4); }
.side-group { display: flex; flex-direction: column; gap: 2px; }
.side-group > h2 { font-size: .8rem; font-weight: 500; color: var(--muted); padding: 0 10px 4px; display: flex; justify-content: space-between; }
.side-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 6px 10px; border-radius: 10px; border: 0; background: none; color: var(--ink-2);
  font: inherit; font-size: .92rem; font-weight: 500; text-align: left; cursor: pointer; transition: background .12s; }
.side-item .ico { color: var(--muted); }
.side-item:hover { background: var(--active); }
.side-item:active { background: var(--control); }
.side-item[aria-current] { background: var(--active); color: var(--ink); font-weight: 600; }
.side-item[aria-current] .ico { color: var(--ink); }
.side-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-item.set { padding-left: 38px; }
.side-item .cnt { flex: none; font-size: .78rem; font-weight: 600; color: var(--warn); }
.side-item.more { color: var(--muted); padding-left: 38px; font-size: .86rem; }
.side-item.add { color: var(--accent); }
.side-item.add .ico { color: var(--accent); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.side-acct { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 10px; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.side-acct:hover { background: var(--active); }
.side-acct .who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.side-acct .who b { font-size: .9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-acct .who span { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.side-signin { display: flex; flex-direction: column; gap: 8px; padding: 0 10px; }
.side-signin p { font-size: .82rem; color: var(--muted); }
.side-credit { font-size: .78rem; color: var(--muted); padding: 0 10px; }
.side-credit .heart { color: var(--bad); }
.av { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex: none; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-deep); font-weight: 700; font-size: .85rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; display: inline-block; }
.dot.busy { background: var(--warn-mark); }
.dot.err { background: var(--bad); }
.icon-btn { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .12s, border-color .12s, transform .1s; }
.icon-btn:hover { border-color: var(--control); background: var(--surface-2); }
.icon-btn:active { transform: scale(.94); }
.side-close { display: none; }
.acct-mini { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 5px; background: none; cursor: pointer; }
.acct-mini .av { width: 30px; height: 30px; }
.acct-mini .dot { position: absolute; right: 4px; bottom: 4px; box-shadow: 0 0 0 2px var(--bg); }
@media (min-width: 1024px) { #topNav, .m-only { display: none !important; } }

/* Top row: back button on desktop; on phones the bar with the toolbar button and the name */
.top { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.top .brand { display: none; }
.top .spacer { flex: 1; }
.menu-btn { display: none; }
.at-home .top { display: none; }
.scrim { display: none; }

/* ---------- Buttons ---------- */
.btn { font: inherit; font-weight: 600; font-size: .9rem; border-radius: 999px; border: 1px solid var(--control); background: var(--surface); color: var(--ink); min-height: 38px; padding: 7px 16px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.3; white-space: nowrap; transition: background .12s, border-color .12s, color .12s, transform .1s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
:root[data-theme="dark"] .btn.primary:hover { background: #8DB1FF; border-color: #8DB1FF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary:hover { background: #8DB1FF; border-color: #8DB1FF; } }
.btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent-deep); }
.btn.soft:hover { border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--active); }
.btn.danger { color: var(--bad); }
.btn.armed, .btn.armed:hover { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.big { font-size: 1rem; min-height: 46px; padding: 10px 22px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }

/* ---------- Title row, panels ---------- */
.title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.title-txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.title-row .title-txt { flex: 1 1 320px; }
.title-txt h1 { overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: .95rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; }
.lead { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; background: var(--accent-soft); color: var(--accent-deep); border-radius: var(--r); padding: 16px 20px; }
.lead b { font-weight: 700; }
.empty { border: 1.5px dashed var(--control); border-radius: var(--r); padding: 28px 22px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.howto { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.howto li::marker { color: var(--muted); font-weight: 600; }

/* Pills: pale tint, dark ink of the same hue, sentence case */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { flex: none; white-space: nowrap; font-size: .76rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); }
.chip.accent { background: var(--accent-soft); color: var(--accent-deep); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.ai { background: var(--ai-soft); color: var(--ai); }

/* Library: one panel, a row per set */
.sets { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.setrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 24px; align-items: center; padding: 18px 20px; }
.setrow + .setrow { border-top: 1px solid var(--rule); }
.set-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.set-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.set-title { font: inherit; font-size: 1.05rem; font-weight: 600; color: var(--ink); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.set-title:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.set-meta { color: var(--muted); font-size: .88rem; }
.set-mastery { display: flex; align-items: center; gap: 6px 16px; flex-wrap: wrap; margin-top: 4px; }
.set-mastery .mbar { flex: 0 1 280px; }
.set-actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }

/* Mastery: one bar split into known / often missed / not yet tried */
.mbar { display: flex; gap: 2px; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-2); min-width: 120px; }
.mbar i { flex: 1 1 0; min-width: 3px; display: block; }
.mbar .k, .mlegend .k { background: var(--ok); }
.mbar .w, .mlegend .w { background: var(--warn-mark); }
.mbar .t, .mlegend .t { background: var(--active); }
.mbar.big { height: 12px; }
.mlegend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .84rem; color: var(--muted); }
.mlegend span { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.mlegend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* KPIs: one container split by hairlines */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--rule); border-radius: var(--r-in); overflow: hidden; }
.kpis > div { background: var(--surface); padding: 4px 18px 4px 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpis > div + div { padding-left: 18px; }
.kpis span { font-size: .84rem; color: var(--muted); }
.kpis b { font-size: 1.55rem; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpis b.warn { color: var(--warn); }

/* ---------- Forms ---------- */
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: .9rem; }
textarea, input[type="text"], input[type="search"], input[type="number"], select { font: inherit; font-weight: 400; color: var(--ink); background: var(--surface); border: 1px solid var(--control); border-radius: var(--r-in); padding: 9px 12px; width: 100%; min-height: 40px; }
textarea { resize: vertical; min-height: 120px; font-size: .88rem; line-height: 1.5; }
textarea.code { font-family: var(--f-mono); font-size: .8rem; min-height: 220px; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
::placeholder { color: var(--muted); opacity: .85; }
input[type="file"] { font: inherit; font-size: .86rem; color: var(--muted); max-width: 100%; }
.opt-group { display: flex; flex-wrap: wrap; gap: 6px; }
.opt-group label { cursor: pointer; }
.opt-group input { position: absolute; opacity: 0; pointer-events: none; }
.opt-group span { display: inline-block; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--control); background: var(--surface); font-weight: 500; font-size: .88rem; transition: background .12s, border-color .12s; }
.opt-group label:hover span { background: var(--surface-2); }
.opt-group input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); font-weight: 600; }
.opt-group input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500; font-size: .92rem; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
details.prompt { background: var(--surface-2); border-radius: var(--r-in); padding: 10px 14px; }
details.prompt summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
details.prompt pre { white-space: pre-wrap; font-size: .8rem; margin: 10px 0 0; font-family: var(--f-mono); overflow-wrap: anywhere; max-height: 50vh; overflow: auto; }
.import-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
.import-grid .panel { display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 1180px) { .import-grid { grid-template-columns: 1fr; } }

/* Setup: a label column beside its options */
.srow { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 8px 28px; padding: 18px 0; }
.srow + .srow { border-top: 1px solid var(--rule); }
.srow > b { font-weight: 600; padding-top: 6px; }
.srow > div { display: flex; flex-direction: column; gap: 8px; }
.srow:first-child { padding-top: 0; }

/* Notices */
.note { border-radius: 12px; padding: 12px 16px; font-size: .9rem; display: flex; flex-direction: column; gap: 4px; }
.note.ok { background: var(--ok-soft); color: var(--ok); }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.ai { background: var(--ai-soft); color: var(--ai); }
.note.info { background: var(--accent-soft); color: var(--accent-deep); }
.note ul { margin: 4px 0 0; padding-left: 18px; color: var(--ink); }
.note b { font-weight: 700; }
.note .row { margin-top: 6px; }

/* Question list */
.qlist { display: flex; flex-direction: column; gap: 10px; }
.qitem { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.qitem.flag { border-color: var(--warn-mark); }
.qitem .qtext { font-weight: 600; overflow-wrap: anywhere; white-space: pre-wrap; min-width: 0; }
.codeblk { font-family: var(--f-mono); font-size: .86em; font-weight: 500; line-height: 1.55; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.mono { font-family: var(--f-mono); font-size: .92em; }
.qitem ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.qitem li { display: flex; gap: 8px; font-size: .92rem; overflow-wrap: anywhere; }
.qitem li .k { font-weight: 700; color: var(--muted); min-width: 1.2em; }
.qitem li.right { color: var(--ok); font-weight: 600; }
.qitem li.right .k { color: var(--ok); }
.qitem li.picked { color: var(--bad); }
.qitem li.picked .k { color: var(--bad); }
.qitem .exp { font-size: .87rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; white-space: pre-wrap; }
.qsearch { max-width: 360px; }

/* History */
.tablewrap { overflow-x: auto; }
table.runs { width: 100%; border-collapse: collapse; font-size: .88rem; font-variant-numeric: tabular-nums; }
table.runs th { text-align: left; font-size: .8rem; color: var(--muted); font-weight: 500; padding: 6px 16px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }

// Keyed by a hash of question + options, so stats survive reordering; editing a question starts it fresh.

function qKey(q) {

function recordStats(setId, items) {

  for (const it of items) {
    if (it.skipped) continue; // untouched questions say nothing about what you know

// AI often writes code and formulas as LaTeX ($one=7^{*}3\%4$). Turn the simple cases back into plain text.
function cleanLatex(input) {
  let s = String(input ?? '');
  if (!/[$\\]|\^\{|_\{/.test(s)) return s;
  const inner = t => t
    .replace(/\\(?:text|mathrm|mathbf|mathit|texttt|operatorname)\{([^{}]*)\}/g, '$1')
    .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)')
    .replace(/\\sqrt\{([^{}]*)\}/g, '√($1)')
    .replace(/\\left|\\right/g, '')
    .replace(/\^\{\s*\*\s*\}/g, '*')
    .replace(/\^\{([^{}]*)\}/g, '^$1')
    .replace(/_\{([^{}]*)\}/g, '_$1')
    .replace(/\\times\b/g, '×').replace(/\\cdot\b/g, '·').replace(/\\div\b/g, '÷')
    .replace(/\\(?:leq|le)\b/g, '≤').replace(/\\(?:geq|ge)\b/g, '≥').replace(/\\(?:neq|ne)\b/g, '≠')
    .replace(/\\(?:ldots|cdots|dots)\b/g, '…').replace(/\\pi\b/g, 'π').replace(/\\infty\b/g, '∞')
    .replace(/\\rightarrow\b|\\to\b/g, '→').replace(/\\Rightarrow\b/g, '⇒')
    .replace(/\\([%_&#{}$])/g, '$1')
    .replace(/\\[,;! ]/g, ' ');
  s = s.replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => inner(t));
  s = s.replace(/\\\((.+?)\\\)/g, (_, t) => inner(t)).replace(/\\\[([\s\S]+?)\\\]/g, (_, t) => inner(t));
  // A $…$ pair only counts as math when it hugs its content, so PHP/shell variables like "$a = 5; $b" stay untouched.
  s = s.replace(/(^|[\s(\[:,;=])\$(?!\s)([^$\n]+?)(?<!\s)\$(?=$|[\s.,;:)\]!?])/gm, (_, pre, t) => pre + inner(t));
  return s.replace(/\^\{\s*\*\s*\}/g, '*').replace(/\\([%_&#])/g, '$1');
}
function cleanQuestion(q) {
  return Object.assign({}, q, { question: cleanLatex(q.question), options: q.options.map(cleanLatex), explanation: cleanLatex(q.explanation || '') });
}

const VI_CHARS = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i;

/* ---------- Parsing what the AI returns ---------- */
function extractJson(text) {
  let t = String(text || '').trim();
  if (!t) throw new Error('Ô nhập đang trống. Hãy dán nội dung AI trả về hoặc chọn file .json.');
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) t = fence[1].trim();
  const start = t.search(/[\[{]/);
  if (start < 0) throw new Error('Không tìm thấy dữ liệu JSON. Kiểm tra lại xem đã dán đúng phần AI trả về chưa.');
  const close = t[start] === '{' ? '}' : ']';
  const end = t.lastIndexOf(close);
  if (end <= start) throw new Error('Dữ liệu bị cắt giữa chừng (thiếu dấu đóng ngoặc). Thường do đề quá dài: hãy nhờ AI làm từng phần, ví dụ câu 1–50, rồi dán lần lượt.');
  const body = t.slice(start, end + 1);
  try { return JSON.parse(body); } catch (e1) {
    try { return JSON.parse(body.replace(/,\s*([}\]])/g, '$1')); } catch (e2) {
      throw new Error('JSON bị lỗi cú pháp nên không đọc được. Thường do AI trả lời bị cắt hoặc chèn chữ vào giữa. Hãy yêu cầu AI xuất lại, hoặc chia đề thành nhiều phần nhỏ hơn.');
    }
  }
}
function normAnswer(a, n) {

  for (const x of arr) {
    if (x == null || x === '') continue;
    let idx = -1;
    if (typeof x === 'number' || /^\s*\d+\s*$/.test(String(x))) { const v = Number(x); idx = zeroBased ? v : v - 1; }

}

  if (!Array.isArray(list)) throw new Error('Không thấy danh sách "questions" trong dữ liệu. Hãy dùng đúng prompt mẫu.');

  list.forEach((item, i) => {

    if (r.badAnswer.length) badAnswer.push(`Câu ${n}: đáp án "${r.badAnswer.join(', ')}" không khớp lựa chọn nào`);
    else if (r.noAnswer) noAnswer.push(n);

}

/* ---------- Backup and restore of everything on this browser ---------- */
function backupText() { return JSON.stringify({ app: 'onde-quiz', version: 1, exportedAt: new Date().toISOString(), sets: state.sets, history: state.history }, null, 1); }

function restoreBackup(text) {
  const raw = extractJson(text);
  if (!raw || !Array.isArray(raw.sets)) throw new Error('Đây không phải file sao lưu của Memora. Nếu là một bộ đề, hãy dùng "Thêm bộ đề".');
  let added = 0, updated = 0;
  for (const s of raw.sets) {
    if (!s || !s.id || !Array.isArray(s.questions)) continue;
    const questions = s.questions.map(q => normQuestionClean(q)).filter(r => !r.problems.length).map(r => r.q);
    const incoming = { id: String(s.id), title: String(s.title || 'Bộ đề chưa đặt tên'), questions, createdAt: s.createdAt || Date.now(), updatedAt: s.updatedAt || Date.now(), sample: !!s.sample };
    const i = state.sets.findIndex(x => x.id === incoming.id);
    if (i < 0) { incoming.updatedAt = Date.now(); delete state.deleted[incoming.id]; state.sets.push(incoming); added++; }
    else if ((incoming.updatedAt || 0) >= (state.sets[i].updatedAt || 0)) { state.sets[i] = incoming; updated++; }
  }
  for (const [id, hIn] of Object.entries(raw.history || {})) {
    if (!hIn || typeof hIn !== 'object') continue;
    const cur = state.history[id] || { best: 0, attempts: 0, runs: [] };
    const runs = [...(cur.runs || []), ...(Array.isArray(hIn.runs) ? hIn.runs : [])];
    const seen = new Set();
    cur.runs = runs.filter(r => r && !seen.has(r.at) && seen.add(r.at)).sort((a, b) => b.at - a.at).slice(0, 30);
    cur.best = Math.max(cur.best || 0, Number(hIn.best) || 0);
    cur.attempts = Math.max(cur.attempts || 0, Number(hIn.attempts) || 0);
    if (hIn.qs && typeof hIn.qs === 'object') cur.qs = mergeQs(cur.qs, hIn.qs);
    state.history[id] = cur;
  }

let view = { name: 'home' };
/* ---------- Navigation history ---------- */
// Each screen is a browser history entry, so the ‹ button, the phone's back gesture and Android's back key all step back.
// A quiz and its result share one entry: the result replaces the quiz, and a new attempt replaces the result.
const views = [view];
let vIdx = 0, backArmedAt = 0;
const histOk = (() => { try { history.replaceState({ v: 0 }, ''); return true; } catch { return false; } })(); // fails on some previews (data: URLs)
function nav(next, replace) {
  view = next;
  if (!histOk) return;
  if (replace) { views[vIdx] = next; history.replaceState({ v: vIdx }, ''); }
  else { vIdx++; views.length = vIdx; views.push(next); history.pushState({ v: vIdx }, ''); }
}
function go(name, params = {}) { stopTimer(); nav(Object.assign({ name }, params)); render(true); }
function goBack() { if (vIdx > 0) history.back(); else go('home'); }
const quizRunning = () => view.name === 'play' && play && !play.finished && !play.abandoned;
window.addEventListener('popstate', e => {
  const i = e.state && typeof e.state.v === 'number' ? e.state.v : 0;
  if (quizRunning()) {
    // One stray swipe should not throw away a quiz in progress: ask for a second back first.
    if (Date.now() - backArmedAt > 3000) {
      backArmedAt = Date.now();
      history.pushState({ v: vIdx }, '');
      toast('Quay lại lần nữa để thoát bài đang làm.', 3000, true);
      return;
    }
    play.abandoned = true;
  }
  document.querySelectorAll('.overlay').forEach(o => o.remove()); // back closes an open dialog along with its screen
  closeDrawer();
  stopTimer();
  vIdx = i;
  let next = views[i];
  // Entries from before a reload, or a quiz that was left, can't be shown again: fall back to the library.
  if (!next
    || (next.name === 'play' && (!play || play.finished || play.abandoned))
    || (next.name === 'result' && !(play && play.finished))) next = { name: 'home' };
  views[i] = view = next;
  render(true);
});
function refresh() { render(false); }
function renderNav() {
  document.getElementById('backBtn').hidden = view.name === 'home' || view.name === 'play'; // the quiz has its own "Thoát"
  document.getElementById('updateBar').hidden = !updateReady || view.name === 'play'; // never interrupt a quiz
  const wrap = document.querySelector('.wrap');
  wrap.classList.toggle('focus', view.name === 'play'); // the quiz takes the whole screen
  wrap.classList.toggle('at-home', view.name === 'home');
  $nav.replaceChildren();
  if (view.name !== 'play' && cloud.status === 'in') $nav.append(accountChip());
  renderSide();
}

// How well a set is known, from the per-question stats: known = tried and not on the "hay sai" list,
// weak = on that list (same rule as weakList), todo = never tried. Only playable questions count.
function masteryOf(set) {
  const qs = (state.history[set.id] || {}).qs || {};
  let known = 0, weak = 0, todo = 0;
  for (const q of set.questions) {
    if (!playable(q)) continue;
    const st = qs[qKey(q)];
    if (!st || !st.n) todo++;
    else if (st.w > 0 && st.s < MASTER_STREAK) weak++;
    else known++;
  }
  return { known, weak, todo, total: known + weak + todo };
}
function masteryBar(m, big) {
  const seg = (n, cls) => n ? h('i', { class: cls, style: `flex-grow:${n}` }) : null;
  return h('div', { class: 'mbar' + (big ? ' big' : ''), role: 'img', 'aria-label': `Đã thuộc ${m.known}, hay sai ${m.weak}, chưa làm ${m.todo} trong ${m.total} câu` },
    seg(m.known, 'k'), seg(m.weak, 'w'), seg(m.todo, 't'));
}

    if (tag === 'BUTTON' && e.target.id !== 'nextBtn') return;
    e.preventDefault();
    if (p.mode === 'practice') { if (graded) practiceNext(); else if (it.multi && it.sel.size) answer(false); }
    else goTo(p.i + 1);
  } else if (e.key === ' ' && graded && (tag !== 'BUTTON' || e.target.id === 'nextBtn')) { e.preventDefault(); practiceNext(); }
});

/* ---------- Result ---------- */
function viewResult() {
  const p = play;
  const total = p.items.length, pct = Math.round(p.correct / total * 100);
  const missed = p.log.filter(l => !l.ok);
  const skipped = p.log.filter(l => l.skipped).length;
  const hist = state.history[p.setId];
  const verdict = pct >= 90 ? 'Xuất sắc! Bạn nắm rất chắc bộ đề này.' : pct >= 70 ? 'Khá tốt! Ôn lại vài câu sai là ổn.' : pct >= 50 ? 'Tạm được. Làm lại câu sai thêm vài lượt nhé.' : 'Cần ôn thêm. Xem kỹ giải thích các câu sai bên dưới.';
  const modeName = p.kind === 'weak' ? 'Ôn câu hay sai' : p.retry ? 'Làm lại câu sai' : (p.mode === 'test' ? 'Kiểm tra' : 'Ôn tập');
  const set = getSet(p.ref);
  const weak = set ? weakList(set) : [];
  const tiles = p.mode === 'test'
    ? [[`${p.correct}/${total}`, 'Câu đúng'], [total - p.correct - skipped, 'Câu sai'], [skipped, 'Bỏ trống'], [fmtTime(p.duration), 'Thời gian']]
    : [[`${p.correct}/${total}`, 'Câu đúng'], [p.score.toLocaleString('vi-VN'), 'Điểm'], [skipped ? skipped : p.bestStreak, skipped ? 'Bỏ qua' : 'Chuỗi dài nhất'], [fmtTime(p.duration), 'Thời gian']];
  const head = h('section', { class: 'panel result-head' },
    h('div', { class: 'title-txt' },
      h('h1', null, 'Kết quả'),
      h('p', { class: 'sub' }, modeName + ' · ' + p.title)),
    h('div', { class: 'verdict' },
      h('div', { class: 'bigpct', style: `color:${pct >= 70 ? 'var(--ok)' : pct >= 50 ? 'var(--warn)' : 'var(--bad)'}` }, pct + '%'),
      h('p', null, verdict)),
    h('div', { class: 'kpis' }, tiles.map(([v, l]) => kpi(l, String(v)))),
    !p.retry && hist ? h('p', { class: 'muted small num' }, `Cao nhất của bạn với bộ đề này: ${hist.best}% · ${hist.attempts} lần làm`) : null,
    p.kind === 'weak' ? h('p', { class: 'muted small num' }, weak.length
      ? `Còn ${weak.length} câu hay sai. Câu nào làm đúng ${MASTER_STREAK} lần liên tiếp sẽ ra khỏi danh sách.`
      : 'Bạn đã thuộc hết các câu hay sai của bộ đề này.') : null,
    h('div', { class: 'row' },
      missed.length ? btn(`Làm lại ${missed.length} câu sai${skipped ? ' và bỏ trống' : ''}`, () => startPlay(p.ref, missed.map(w => w.qi)), 'primary big') : null,
      weak.length ? btn(`Ôn ${weak.length} câu hay sai`, () => startPlay(p.ref, weak.map(x => x.i), 'weak'), missed.length ? 'big' : 'primary big') : null,
      btn('Làm lại từ đầu', () => startPlay(p.ref), missed.length || weak.length ? 'big' : 'primary big'),
      btn('Xem lịch sử', () => go('detail', { ref: p.ref }), 'ghost big'),
      btn('Về thư viện', () => go('home'), 'ghost big')));
  const parts = [head];
  const shown = view.showAll ? p.log : missed;
  const toggle = btn(view.showAll ? 'Chỉ hiện câu sai' : `Xem tất cả ${total} câu`, () => { view.showAll = !view.showAll; refresh(); }, 'ghost');
  parts.push(h('section', { class: 'stack' },
    h('div', { class: 'sec-head' }, h('h2', null, view.showAll ? `Toàn bộ bài làm (${total})` : `Các câu sai${skipped ? ' và bỏ trống' : ''} (${missed.length})`), toggle),
    h('p', { class: 'muted small' }, 'Màu xanh là đáp án đúng, màu đỏ là lựa chọn sai của bạn. Thứ tự A, B, C theo đề gốc.'),
    shown.length
      ? h('div', { class: 'qlist' }, shown.map(w => qItem(w.q, w.qi, {
          picked: w.chosen,
          note: w.skipped ? 'Bạn bỏ trống câu này.' : (w.ok ? 'Bạn làm đúng câu này.' : null),
          actions: canEdit(p.ref) ? btn('Sửa', () => openEdit(p.ref, w.qi, () => toast('Đã lưu câu hỏi')), 'ghost') : null })))
      : h('div', { class: 'note ok' }, h('b', null, 'Không sai câu nào. Tuyệt vời!'))));
  return h('div', { class: 'stack', style: 'gap:24px' }, parts);
}

/* ---------- Cloud sync: Google sign-in + Firestore (hosted version only) ---------- */
// The config is public by design; access is guarded by the Firestore rules (each user reads/writes only users/<uid>/...).
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyCdPMIxP56g-2BYx_3TU8S9ZdkmYbmznWA',
  authDomain: 'on-de-quiz.firebaseapp.com',
  projectId: 'on-de-quiz',
  storageBucket: 'on-de-quiz.firebasestorage.app',
  messagingSenderId: '795491404640',
  appId: '1:795491404640:web:8e41acf3014fed8316ac05'
};
const FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
// status: 'off' = not available here, 'loading', 'out' = signed out, 'in' = signed in
const cloud = { status: 'off', user: null, lastSync: 0, busy: false, error: '' };
let fb = null, syncTimer = 0, syncing = false, syncAgain = false, lastSyncedSig = '';

const syncSig = () => JSON.stringify([state.sets.map(s => [s.id, s.updatedAt || 0]), state.history, state.deleted]);
function scheduleSync() {
  if (cloud.status !== 'in') return;
  if (syncSig() === lastSyncedSig) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 1500);
}
async function initCloud() {
  const okHost = location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname);
  if (!okHost || window.claude) return; // file:// or inside Claude: stay local-only
  cloud.status = 'loading';
  try {
    const [appM, authM, fsM] = await Promise.all([import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-auth.js'), import(FB_SDK + 'firebase-firestore.js')]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    fb = { auth: authM.getAuth(app), db: fsM.getFirestore(app), A: authM, F: fsM };
    cloud.status = 'out';
    fb.A.onAuthStateChanged(fb.auth, u => {
      cloud.user = u ? { uid: u.uid, name: u.displayName || '', email: u.email || '', photo: u.photoURL || '' } : null;
      cloud.status = u ? 'in' : 'out';
      cloud.error = ''; lastSyncedSig = '';
      updateChrome();
      if (u) syncNow();
    });
    fb.A.getRedirectResult(fb.auth).catch(cloudError);
  } catch (e) {
    cloud.status = 'off';
    cloud.error = 'Không tải được phần đăng nhập. Kiểm tra mạng rồi tải lại trang.';
  }
  updateChrome();
}
async function signIn() {
  if (!fb) { toast(cloud.error || 'Phần đăng nhập đang tải, thử lại sau vài giây.'); return; }
  const provider = new fb.A.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try { await fb.A.signInWithPopup(fb.auth, provider); }
  catch (e) {
    const code = (e && e.code) || '';
    if (code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment') {
      try { await fb.A.signInWithRedirect(fb.auth, provider); } catch (e2) { cloudError(e2); }
    } else if (code !== 'auth/popup-closed-by-user' && code !== 'auth/cancelled-popup-request') cloudError(e);
  }
}
async function signOutCloud() {
  try { await fb.A.signOut(fb.auth); toast('Đã đăng xuất. Bộ đề vẫn còn trên máy này.'); } catch (e) { cloudError(e); }
}
function cloudError(e) {
  const code = (e && e.code) || '';
  cloud.error =
    code === 'auth/unauthorized-domain' ? 'Trang này chưa được phép đăng nhập. Thêm tên miền vào Firebase → Authentication → Settings → Authorized domains.'
    : code === 'permission-denied' ? 'Firestore từ chối ghi dữ liệu. Kiểm tra lại quy tắc bảo mật (tab Rules).'
    : code === 'auth/network-request-failed' || code === 'unavailable' ? 'Mất kết nối mạng. Dữ liệu vẫn lưu trên máy và sẽ đồng bộ khi có mạng.'
    : code === 'auth/web-storage-unsupported' || code === 'auth/internal-error' ? 'Trình duyệt này chặn đăng nhập (thường gặp khi mở trong Zalo/Messenger). Hãy mở link bằng Chrome hoặc Safari.'
    : 'Chưa đồng bộ được: ' + ((e && e.message) || 'lỗi không rõ');
  toast(cloud.error, 6000, true);
  updateChrome();
}
function mergeHistory(a, b) {
  const out = {};
  for (const id of new Set([...Object.keys(a || {}), ...Object.keys(b || {})])) {
    const x = (a || {})[id] || {}, y = (b || {})[id] || {};
    const seen = new Set();
    const runs = [...(x.runs || []), ...(y.runs || [])].filter(r => r && !seen.has(r.at) && seen.add(r.at)).sort((p, q) => q.at - p.at).slice(0, 30);
    const h1 = { best: Math.max(x.best || 0, y.best || 0), attempts: Math.max(x.attempts || 0, y.attempts || 0), runs };
    const qs = mergeQs(x.qs, y.qs);
    if (Object.keys(qs).length) h1.qs = qs;
    const latest = (x.lastAt || 0) >= (y.lastAt || 0) ? x : y;
    if (latest.last != null) h1.last = latest.last;
    if (latest.lastAt) h1.lastAt = latest.lastAt;
    out[id] = h1;
  }
  return out;
}
const toCloudSet = s => JSON.parse(JSON.stringify({ title: s.title || '', questions: s.questions || [], createdAt: s.createdAt || 0, updatedAt: s.updatedAt || 0, sample: !!s.sample }));
function fromCloudSet(id, d) {
  const questions = (Array.isArray(d.questions) ? d.questions : []).filter(q => q && typeof q.question === 'string' && Array.isArray(q.options) && Array.isArray(q.answer));
  return Object.assign({ id, title: String(d.title || 'Bộ đề chưa đặt tên'), questions, createdAt: d.createdAt || 0, updatedAt: d.updatedAt || 0 }, d.sample ? { sample: true } : {});
}
// Two-way merge: newest copy of each set wins, deletions win over older copies, history runs are unioned.
async function syncNow() {
  if (cloud.status !== 'in' || !fb) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; cloud.busy = true; updateChrome();
  const { F, db } = fb, uid = cloud.user.uid;
  const before = JSON.stringify([state.sets, state.history]);
  try {
    const setsCol = F.collection(db, 'users', uid, 'sets');
    const histRef = F.doc(db, 'users', uid, 'meta', 'history');
    const delRef = F.doc(db, 'users', uid, 'meta', 'deleted');
    const [snap, hs, ds] = await Promise.all([F.getDocs(setsCol), F.getDoc(histRef), F.getDoc(delRef)]);
    const remote = new Map(snap.docs.map(d => [d.id, fromCloudSet(d.id, d.data())]));
    const rDeleted = ds.exists() ? (ds.data().ids || {}) : {};
    const rHist = hs.exists() ? (hs.data().sets || {}) : {};

    const deleted = Object.assign({}, rDeleted);
    for (const [id, t] of Object.entries(state.deleted)) deleted[id] = Math.max(deleted[id] || 0, t);
    const local = new Map(state.sets.map(s => [s.id, s]));
    const merged = [];
    for (const id of new Set([...local.keys(), ...remote.keys()])) {
      const l = local.get(id), r = remote.get(id);
      const pick = !l ? r : !r ? l : ((r.updatedAt || 0) > (l.updatedAt || 0) ? r : l);
      if (deleted[id] && deleted[id] >= (pick.updatedAt || 0)) continue;
      merged.push(pick);
    }
    merged.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const hist = mergeHistory(state.history, rHist);
    for (const id of Object.keys(hist)) if (deleted[id] && !merged.some(s => s.id === id)) delete hist[id];

    state.sets = merged; state.history = hist; state.deleted = deleted;
    saveLocal();

    const writes = [];
    for (const s of merged) { const r = remote.get(s.id); if (!r || (r.updatedAt || 0) !== (s.updatedAt || 0)) writes.push(b => b.set(F.doc(setsCol, s.id), toCloudSet(s))); }
    for (const id of remote.keys()) if (!merged.some(s => s.id === id)) writes.push(b => b.delete(F.doc(setsCol, id)));
    if (JSON.stringify(hist) !== JSON.stringify(rHist)) writes.push(b => b.set(histRef, { sets: JSON.parse(JSON.stringify(hist)) }));
    if (JSON.stringify(deleted) !== JSON.stringify(rDeleted)) writes.push(b => b.set(delRef, { ids: deleted }));
    for (let k = 0; k < writes.length; k += 400) {
      const batch = F.writeBatch(db);
      writes.slice(k, k + 400).forEach(w => w(batch));
      await batch.commit();
    }
    cloud.lastSync = Date.now(); cloud.error = '';
    lastSyncedSig = syncSig();
  } catch (e) {
    const big = e && /exceeds the maximum allowed size|larger than/i.test(e.message || '');
    if (big) { cloud.error = 'Có bộ đề quá lớn để lưu lên mạng (giới hạn khoảng 1 MB mỗi bộ). Hãy tách thành nhiều bộ nhỏ hơn.'; toast(cloud.error, 6000, true); }
    else cloudError(e);
  } finally {
    syncing = false; cloud.busy = false;
    const changed = JSON.stringify([state.sets, state.history]) !== before;
    if (changed && view.name !== 'play') refresh(); else updateChrome();
    if (syncAgain) { syncAgain = false; scheduleSync(); }
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && cloud.status === 'in' && Date.now() - cloud.lastSync > 60000 && view.name !== 'play') syncNow();
});
function accountChip() {
  const u = cloud.user;
  const dot = cloud.busy ? 'busy' : cloud.error ? 'err' : '';
  const label = cloud.busy ? 'Đang đồng bộ…' : cloud.error ? 'Lỗi đồng bộ' : 'Đã đồng bộ';
  const av = u.photo ? h('img', { class: 'av', src: u.photo, alt: '', referrerpolicy: 'no-referrer' }) : h('span', { class: 'av' }, (u.name || u.email || '?').trim().charAt(0).toUpperCase());
  return h('button', { type: 'button', class: 'acct-mini', onclick: openAccount, title: u.email + ' · ' + label, 'aria-label': 'Tài khoản, ' + label }, av, h('span', { class: 'dot ' + dot }));
}
function openAccount() {
  const u = cloud.user; if (!u) return;
  const when = cloud.lastSync ? new Date(cloud.lastSync).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' }) : 'chưa';
  const close = openModal(
    h('h2', null, 'Tài khoản'),
    h('div', { class: 'stack', style: 'gap:4px' }, h('b', null, u.name || 'Không có tên'), h('span', { class: 'muted' }, u.email)),
    h('p', { class: 'muted small' }, `Lần đồng bộ gần nhất: ${when}. Bộ đề và lịch sử làm bài được lưu lên mạng theo tài khoản này, đăng nhập ở máy khác là thấy.`),
    cloud.error ? h('div', { class: 'note bad' }, h('span', null, cloud.error)) : null,
    h('div', { class: 'row' },
      btn('Đồng bộ ngay', () => { close(); syncNow(); }, 'primary'),
      btn('Đăng xuất', () => { close(); signOutCloud(); }),
      btn('Đóng', () => close(), 'ghost')),
    h('p', { class: 'muted small' }, 'Đăng xuất không xóa dữ liệu trên máy này. Nếu đang dùng máy của người khác, hãy xóa bộ đề trước khi đăng xuất.'));
}

// One-time cleanup of LaTeX left in sets saved before this version.
if (state.pendingClean) {
  delete state.pendingClean;
  let fixed = 0;
  if (!state.latexCleaned) {
    for (const set of state.sets) set.questions = set.questions.map(q => { const c = cleanQuestion(q); if (JSON.stringify(c) !== JSON.stringify(q)) fixed++; return c; });
    state.latexCleaned = true;
    save();
  }
  if (fixed) setTimeout(() => toast(`Đã dọn ký hiệu LaTeX trong ${fixed} câu hỏi đã lưu.`, 4000), 300);
}
applyTheme();
render(true);
initCloud();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- Updates ---------- */
// An installed app is usually resumed, not reloaded, so it would keep running an old copy.
// Check GitHub for a newer page on start, whenever the app comes back to the screen, and every 30 minutes.
const online = /^https?:$/.test(location.protocol);
const SKIP_KEY = 'memora.updateSkip';
async function checkForUpdate(manual) {
  if (!online || checkingUpdate) return;
  const say = msg => { if (manual) toast(msg, 3000, true); };
  if (!navigator.onLine) { say('Đang mất mạng, chưa kiểm tra được.'); return; }
  checkingUpdate = true; lastUpdateCheck = Date.now();
  try {
    const res = await fetch(location.pathname, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    const fp = pageFingerprint(doc, [...doc.scripts].find(s => !s.src));
    let skip = null; try { skip = sessionStorage.getItem(SKIP_KEY); } catch {}
    // skip: we already reloaded for this exact version and the page still differs (something else edits it), so don't nag.
    if (fp !== RUNNING_FP && fp !== skip) {
      updateReady = true; newFp = fp; renderNav();
      say('Có bản mới. Bấm "Cập nhật" ở đầu trang.');
    } else say('Bạn đang dùng bản mới nhất.');
  } catch { say('Chưa kiểm tra được, thử lại sau.'); }
  checkingUpdate = false;
}
async function applyUpdate() {
  if (quizRunning()) { toast('Làm xong bài này rồi cập nhật nhé.'); return; }
  toast('Đang cập nhật…', 5000, true);
  try { sessionStorage.setItem(SKIP_KEY, newFp); } catch {}
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update().catch(() => {});
    await fetch(location.pathname, { cache: 'reload' }); // refresh the browser's own copy too
  } catch {}
  location.reload();
}
document.getElementById('updateBtn').addEventListener('click', applyUpdate);
function manualUpdateCheck() {
  if (!online) { toast('Chỉ kiểm tra được khi mở app từ trang web.'); return; }
  toast('Đang kiểm tra…', 2000, true);
  checkForUpdate(true);
}
if (online) {
  setTimeout(() => checkForUpdate(), 4000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - lastUpdateCheck > 60000) checkForUpdate();
  });
  setInterval(() => { if (document.visibilityState === 'visible') checkForUpdate(); }, 30 * 60000);
}
})();
