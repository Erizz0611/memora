<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='12' height='12' rx='3' fill='%233456DB'/%3E%3Crect x='17' y='3' width='12' height='12' rx='3' fill='%230B8577'/%3E%3Crect x='3' y='17' width='12' height='12' rx='3' fill='%23B76A00'/%3E%3Crect x='17' y='17' width='12' height='12' rx='3' fill='%23BC2F7A'/%3E%3C/svg%3E">

<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one centered study column; library as cards, play screen as a big question card over a 2-column grid of answer tiles. */
:root {
  --bg: #EEF1F6; --surface: #FFFFFF; --surface-2: #F5F7FB; --ink: #141B26; --muted: #586377; --line: #D8DEE8;
  --accent: #2D4FD6; --accent-ink: #FFFFFF; --accent-soft: #E3E9FF;
  --ok: #13814A; --ok-soft: #DCF2E5; --bad: #C23131; --bad-soft: #FBE4E4; --warn: #8F5B00; --warn-soft: #FFF0D2;
  --t1: #3456DB; --t2: #0B8577; --t3: #B76A00; --t4: #BC2F7A; --t5: #6A4ED3; --t6: #4C7A1B;
  --ai: #5B3FC4; --ai-soft: #ECE7FF;
  --tile-ink: #FFFFFF; --tile-ok: #14834B; --tile-bad: #C73434;
  --shadow: 0 1px 2px rgb(20 27 38 / .06), 0 6px 20px rgb(20 27 38 / .06);
  --f-display: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E131B; --surface: #161D28; --surface-2: #1B2431; --ink: #E7ECF3; --muted: #9AA5B6; --line: #2A3545;
  --accent: #809BFF; --accent-ink: #0E131B; --accent-soft: #222E4C;
  --ai: #B7A6FF; --ai-soft: #2A2350;
  --ok: #45C882; --ok-soft: #15372A; --bad: #F27171; --bad-soft: #3E1E21; --warn: #F2B653; --warn-soft: #3A2C12;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E131B; --surface: #161D28; --surface-2: #1B2431; --ink: #E7ECF3; --muted: #9AA5B6; --line: #2A3545;
  --accent: #809BFF; --accent-ink: #0E131B; --accent-soft: #222E4C;
  --ai: #B7A6FF; --ai-soft: #2A2350;
  --ok: #45C882; --ok-soft: #15372A; --bad: #F27171; --bad-soft: #3E1E21; --warn: #F2B653; --warn-soft: #3A2C12;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 900px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 56px; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 2.1rem; font-weight: 800; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.num { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; font: inherit; }
.mark { width: 36px; height: 36px; border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 6px; background: var(--surface); box-shadow: var(--shadow); }
.mark i { border-radius: 3px; display: block; }
.mark i:nth-child(1) { background: var(--t1); } .mark i:nth-child(2) { background: var(--t2); }
.mark i:nth-child(3) { background: var(--t3); } .mark i:nth-child(4) { background: var(--t4); }
.brand b { font-family: var(--f-display); font-size: 1.45rem; font-weight: 800; }
.top-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.back { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .15s, border-color .15s, transform .1s; }
.back:hover { border-color: var(--accent); color: var(--accent); }
.back:active { transform: scale(.94); }

/* Buttons */
.btn { font: inherit; font-weight: 600; font-size: .92rem; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; line-height: 1.3; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.big { font-size: 1.05rem; padding: 12px 22px; border-radius: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.hero { display: flex; flex-direction: column; gap: 14px; padding: 24px; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
.hero p { max-width: 60ch; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; background: var(--surface-2); border-radius: 12px; padding: 14px; display: flex; gap: 10px; font-size: .9rem; min-width: 0; }
.steps li::before { content: counter(s); font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; line-height: 1; color: var(--accent); }
@media (max-width: 680px) { .steps { grid-template-columns: 1fr; } }

.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { overflow-wrap: anywhere; }
.card .actions { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .74rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.ai { background: var(--ai-soft); color: var(--ai); border-color: transparent; }
.meter { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); border-radius: inherit; }
.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 22px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* Forms */
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: .9rem; }
textarea, input[type="text"], input[type="number"], select { font: inherit; font-weight: 400; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
textarea { resize: vertical; min-height: 120px; font-size: .88rem; line-height: 1.5; }
textarea.code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .8rem; min-height: 220px; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.opt-group { display: flex; flex-wrap: wrap; gap: 6px; }
.opt-group label { cursor: pointer; }
.opt-group input { position: absolute; opacity: 0; pointer-events: none; }
.opt-group span { display: inline-block; padding: 7px 13px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .88rem; }
.opt-group input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt-group input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; font-size: .92rem; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }
details.prompt { background: var(--surface-2); border-radius: 10px; padding: 10px 14px; }
details.prompt summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
details.prompt pre { white-space: pre-wrap; font-size: .8rem; margin: 10px 0 0; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; overflow-wrap: anywhere; }

/* Notices */
.note { border-radius: 10px; padding: 10px 14px; font-size: .9rem; display: flex; flex-direction: column; gap: 4px; }
.note.ok { background: var(--ok-soft); color: var(--ok); }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.ai { background: var(--ai-soft); color: var(--ai); }
.note ul { margin: 4px 0 0; padding-left: 18px; color: var(--ink); }
.note b { font-weight: 700; }

/* Question list */
.qlist { display: flex; flex-direction: column; gap: 10px; }
.qitem { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.qitem.flag { border-color: var(--warn); }
.qitem .qtext { font-weight: 600; overflow-wrap: anywhere; white-space: pre-wrap; min-width: 0; }
.codeblk { font-family: var(--f-mono); font-size: .86em; font-weight: 500; line-height: 1.55; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.mono { font-family: var(--f-mono); font-size: .92em; }
.qitem ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.qitem li { display: flex; gap: 8px; font-size: .92rem; overflow-wrap: anywhere; }
.qitem li .k { font-weight: 700; color: var(--muted); min-width: 1.2em; }
.qitem li.right { color: var(--ok); font-weight: 600; }
.qitem li.right .k { color: var(--ok); }
.qitem li.picked { color: var(--bad); }
.qitem li.picked .k { color: var(--bad); }
.qitem .exp { font-size: .86rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; white-space: pre-wrap; }

/* History */
.tablewrap { overflow-x: auto; }
table.runs { width: 100%; border-collapse: collapse; font-size: .88rem; font-variant-numeric: tabular-nums; }
table.runs th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.runs td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.runs tr:last-child td { border-bottom: 0; }
.spark { display: flex; align-items: flex-end; gap: 4px; height: 72px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.spark i { flex: 1 1 0; max-width: 22px; border-radius: 4px 4px 0 0; display: block; }

/* Play layout: question column + summary panel */
.wrap.wide { max-width: 1180px; }
.playgrid { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 20px; align-items: start; }
.aside { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.sumstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
.sumstats div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; }
.sumstats b { font-family: var(--f-display); font-size: 1.35rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.sumstats span { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; max-height: 46vh; overflow: auto; padding: 4px; margin: -4px; }
.qn { font: inherit; font-weight: 700; font-size: .85rem; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
.qn:hover { border-color: var(--muted); }
.qn.ok { background: var(--tile-ok); color: #fff; border-color: transparent; }
.qn.bad { background: var(--tile-bad); color: #fff; border-color: transparent; }
.qn.filled { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.qn.cur { outline: 3px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .78rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.navrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill.low { background: var(--bad); color: #fff; border-color: transparent; }
@media (max-width: 900px) { .playgrid { grid-template-columns: 1fr; } .aside { position: static; } }

/* Play */
.play { display: flex; flex-direction: column; gap: 16px; }
.hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.hud .stats { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; font-weight: 700; font-size: .88rem; font-variant-numeric: tabular-nums; }
.pill.hot { background: var(--t3); color: #fff; border-color: transparent; }
.progress { height: 8px; border-radius: 99px; background: var(--surface); overflow: hidden; border: 1px solid var(--line); }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.qcard { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.qcard .qtext { font-size: clamp(1.15rem, 2.6vw, 1.5rem); font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-wrap; }
.qcard .qmeta { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.timer { position: absolute; left: 0; top: 0; height: 5px; width: 100%; background: var(--accent); transform-origin: left; }
.timer.low { background: var(--bad); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } }
/* All answer tiles share one calm neutral look; colour only appears for selected / right / wrong. */
.tile { font: inherit; text-align: left; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 16px 16px 16px 14px; min-height: 84px; display: flex; gap: 12px; align-items: center; cursor: pointer; font-size: 1.02rem; font-weight: 600; box-shadow: 0 3px 0 var(--line); transition: transform .12s, opacity .2s, box-shadow .12s, background .2s, border-color .2s; position: relative; min-width: 0; }
.tile:hover:not([disabled]) { transform: translateY(-2px); box-shadow: 0 5px 0 var(--line); border-color: var(--accent); }
.tile:active:not([disabled]) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.tile .k { flex: none; width: 32px; height: 32px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; transition: background .2s, color .2s; }
.tile .t { overflow-wrap: anywhere; white-space: pre-wrap; min-width: 0; }
.tile[disabled] { cursor: default; }
.tile.sel { background: var(--accent-soft); border-color: var(--accent); }
.tile.sel .k { background: var(--accent); color: var(--accent-ink); }
.tile.sel .k::after { content: "✓"; }
.tile.sel .k span { display: none; }
.tile.is-correct, .tile.is-wrong { color: var(--tile-ink); border-color: transparent; box-shadow: 0 3px 0 rgb(0 0 0 / .18); }
.tile.is-correct .k, .tile.is-wrong .k { background: rgb(255 255 255 / .22); color: var(--tile-ink); }
.tile.is-correct { background: var(--tile-ok); opacity: 1; }
.tile.is-wrong { background: var(--tile-bad); }
.tile.is-dim { opacity: .32; }
.tile.is-correct .k::after { content: "✓"; } .tile.is-correct .k span { display: none; }
.tile.is-wrong .k::after { content: "✕"; } .tile.is-wrong .k span { display: none; }
.feedback { border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback .fh { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; line-height: 1.2; }
.feedback.ok .fh { color: var(--ok); }
.feedback.bad .fh { color: var(--bad); }
.feedback .exp { white-space: pre-wrap; font-size: .92rem; }
.kbd { font-size: .78rem; color: var(--muted); }
.gain { position: absolute; right: 18px; top: 16px; font-family: var(--f-display); font-weight: 800; font-size: 1.4rem; color: var(--ok); animation: pop .9s ease-out both; }
@keyframes pop { 0% { transform: translateY(8px) scale(.8); opacity: 0; } 30% { transform: translateY(0) scale(1.1); opacity: 1; } 100% { transform: translateY(-6px) scale(1); opacity: 1; } }

/* Result */
.score { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.score div { background: var(--surface-2); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.score b { font-family: var(--f-display); font-size: 1.8rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.score span { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
@media (max-width: 600px) { .score { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.bigpct { font-family: var(--f-display); font-weight: 800; font-size: clamp(3rem, 10vw, 4.5rem); line-height: 1; font-variant-numeric: tabular-nums; }

/* Account button */
.acct { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; font-size: .86rem; cursor: pointer; white-space: nowrap; }
.acct:hover { border-color: var(--muted); }
.acct img, .acct .av { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; }
.acct .av { display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.acct .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.acct .dot.busy { background: var(--warn); }
.acct .dot.err { background: var(--bad); }

function cleanLatex(input) {
  let s = String(input ?? '');

  const inner = t => t
    .replace(/\\(?:text|mathrm|mathbf|mathit|texttt|operatorname)\{([^{}]*)\}/g, '$1')
    .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)')
    .replace(/\\sqrt\{([^{}]*)\}/g, '√($1)')
    .replace(/\\left|\\right/g, '')
    .replace(/\^\{\s*\*\s*\}/g, '*')
    .replace(/\^\{([^{}]*)\}/g, '^$1')
    .replace(/_\{([^{}]*)\}/g, '_$1')
    .replace(/\\times\b/g, '×').replace(/\\cdot\b/g, '·').replace(/\\div\b/g, '÷')

/* ---------- Parsing what the AI returns ---------- */
function extractJson(text) {
  let t = String(text || '').trim();
  if (!t) throw new Error('Ô nhập đang trống. Hãy dán nội dung AI trả về hoặc chọn file .json.');
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) t = fence[1].trim();
  const start = t.search(/[\[{]/);
  if (start < 0) throw new Error('Không tìm thấy dữ liệu JSON. Kiểm tra lại xem đã dán đúng phần AI trả về chưa.');
  const close = t[start] === '{' ? '}' : ']';
  const end = t.lastIndexOf(close);
  if (end <= start) throw new Error('Dữ liệu bị cắt giữa chừng (thiếu dấu đóng ngoặc). Thường do đề quá dài: hãy nhờ AI làm từng phần, ví dụ câu 1–50, rồi dán lần lượt.');
  const body = t.slice(start, end + 1);
  try { return JSON.parse(body); } catch (e1) {
    try { return JSON.parse(body.replace(/,\s*([}\]])/g, '$1')); } catch (e2) {
      throw new Error('JSON bị lỗi cú pháp nên không đọc được. Thường do AI trả lời bị cắt hoặc chèn chữ vào giữa. Hãy yêu cầu AI xuất lại, hoặc chia đề thành nhiều phần nhỏ hơn.');
    }
  }
}
function normAnswer(a, n) {

  let arr = Array.isArray(a) ? a : (typeof a === 'number' ? [a] : String(a).replace(/đáp\s*án\s*(đúng)?\s*[:：]?/ig, ' ').split(/[,;/\s]+/));
  arr = arr.filter(x => !/^(và|and|&)$/i.test(String(x).trim()));
  const zeroBased = arr.some(x => x === 0 || x === '0');
  const out = new Set(), bad = [];
  for (const x of arr) {
    if (x == null || x === '') continue;
    let idx = -1;
    if (typeof x === 'number' || /^\s*\d+\s*$/.test(String(x))) { const v = Number(x); idx = zeroBased ? v : v - 1; }
    else { const s = String(x).trim().toUpperCase().replace(/^ĐÁP ÁN\s*/, '').replace(/[^A-Z]/g, ''); if (!s) continue; if (s.length === 1) idx = letterIdx(s); else { bad.push(String(x)); continue; } }
    if (idx >= 0 && idx < n) out.add(LETTERS[idx]); else bad.push(String(x));
  }
  return { letters: [...out].sort(), bad };
}
function normQuestionRaw(q) {
  if (q == null || typeof q !== 'object') return { q: null, problems: ['không đúng định dạng'] };
  let text = String(q.question ?? q.cauHoi ?? q.q ?? q.text ?? '').trim().replace(/^\s*(câu|cau|question|q)\s*\d+\s*[:.)\-–]\s*/i, '');
  let opts = q.options ?? q.choices ?? q.answers_list ?? q.luaChon ?? [];
  if (opts && !Array.isArray(opts) && typeof opts === 'object') opts = Object.keys(opts).sort().map(k => opts[k]);
  if (!Array.isArray(opts)) opts = [];
  opts = opts.map(o => String(o ?? '').trim()).filter(o => o !== '');
  if (opts.length && opts.every((o, j) => new RegExp('^' + LETTERS[j] + '\\s*[.):]\\s*', 'i').test(o))) opts = opts.map(o => o.replace(/^[A-Za-z]\s*[.):]\s*/, ''));
  const ans = normAnswer(q.answer ?? q.answers ?? q.correct ?? q.dapAn, opts.length);
  const problems = [];
  if (!text) problems.push('thiếu nội dung câu hỏi');
  if (opts.length < 2) problems.push('ít hơn 2 lựa chọn');
  return {
    q: Object.assign({ question: text, options: opts, answer: ans.letters, explanation: String(q.explanation ?? q.giaiThich ?? q.explain ?? '').trim() },
      (q.aiAnswer === true || q.aiAnswer === 'true') && ans.letters.length ? { aiAnswer: true } : {}),
    problems, badAnswer: ans.bad, noAnswer: ans.letters.length === 0

}
function normQuestionClean(q) {

}
function parseImport(text) {
  const raw = extractJson(text);
  if (raw && !Array.isArray(raw) && Array.isArray(raw.sets)) throw new Error('Đây là file sao lưu toàn bộ dữ liệu, không phải một bộ đề. Hãy dùng nút "Khôi phục" ở cuối trang Thư viện.');
  const list =Array.isArray(raw) ? raw : (raw.questions || raw.cauHoi || raw.items || raw.data);
  if (!Array.isArray(list)) throw new Error('Không thấy danh sách "questions" trong dữ liệu. Hãy dùng đúng prompt mẫu.');
  const questions = [], skipped = [], noAnswer = [], badAnswer = [], aiSolved = [], unsure = [], suspect = [];
  list.forEach((item, i) => {
    const r = normQuestionClean(item);
    const n = i + 1;
    if (r.problems.length) { skipped.push(`Câu ${n}: ${r.problems.join(', ')}`); return; }
    if (r.badAnswer.length) badAnswer.push(`Câu ${n}: đáp án "${r.badAnswer.join(', ')}" không khớp lựa chọn nào`);
    else if (r.noAnswer) noAnswer.push(n);
    questions.push(r.q);
    if (r.q.aiAnswer) aiSolved.push(n);
    if (/^\s*\[không chắc chắn\]/i.test(r.q.explanation)) unsure.push(n);
    if (/^\s*\[nghi đề sai\]/i.test(r.q.explanation)) suspect.push(n);
  });

  const more = String(text).match(/C[òo]n\s*ti[ếe]p[^0-9]{0,40}(\d+)/i);
  return { more: more ? Number(more[1]) : null, title: (!Array.isArray(raw) && raw.title) ? String(raw.title).trim() : '', questions, skipped, noAnswer, badAnswer, aiSolved, unsure, suspect, total: m ? Number(m[1]) : null, rawCount: list.length };
}

/* ---------- Backup and restore of everything on this browser ---------- */
function backupText() { return JSON.stringify({ app: 'onde-quiz', version: 1, exportedAt: new Date().toISOString(), sets: state.sets, history: state.history }, null, 1); }
function downloadBackup() { saveFile('memora-sao-luu-' + today() + '.json', backupText(), 'Đã sao chép bản sao lưu. Dán vào một file ghi chú và cất đi.'); }
function restoreBackup(text) {
  const raw = extractJson(text);
  if (!raw || !Array.isArray(raw.sets)) throw new Error('Đây không phải file sao lưu của Memora. Nếu là một bộ đề, hãy dùng "Thêm bộ đề".');
  let added = 0, updated = 0;
  for (const s of raw.sets) {
    if (!s || !s.id || !Array.isArray(s.questions)) continue;
    const questions = s.questions.map(q => normQuestionClean(q)).filter(r => !r.problems.length).map(r => r.q);
    const incoming = { id: String(s.id), title: String(s.title || 'Bộ đề chưa đặt tên'), questions, createdAt: s.createdAt || Date.now(), updatedAt: s.updatedAt || Date.now(), sample: !!s.sample };
    const i = state.sets.findIndex(x => x.id === incoming.id);
    if (i < 0) { incoming.updatedAt = Date.now(); delete state.deleted[incoming.id]; state.sets.push(incoming); added++; }
    else if ((incoming.updatedAt || 0) >= (state.sets[i].updatedAt || 0)) { state.sets[i] = incoming; updated++; }
  }
  for (const [id, hIn] of Object.entries(raw.history || {})) {
    if (!hIn || typeof hIn !== 'object') continue;
    const cur = state.history[id] || { best: 0, attempts: 0, runs: [] };
    const runs = [...(cur.runs || []), ...(Array.isArray(hIn.runs) ? hIn.runs : [])];
    const seen = new Set();
    cur.runs = runs.filter(r => r && !seen.has(r.at) && seen.add(r.at)).sort((a, b) => b.at - a.at).slice(0, 30);
    cur.best = Math.max(cur.best || 0, Number(hIn.best) || 0);
    cur.attempts = Math.max(cur.attempts || 0, Number(hIn.attempts) || 0);
    if (hIn.qs && typeof hIn.qs === 'object') cur.qs = mergeQs(cur.qs, hIn.qs);
    state.history[id] = cur;
  }
  save();
  return { added, updated };
}

let view = { name: 'home' };
/* ---------- Navigation history ---------- */
// Each screen is a browser history entry, so the ‹ button, the phone's back gesture and Android's back key all step back.
// A quiz and its result share one entry: the result replaces the quiz, and a new attempt replaces the result.
const views = [view];
let vIdx = 0, backArmedAt = 0;
const histOk = (() => { try { history.replaceState({ v: 0 }, ''); return true; } catch { return false; } })(); // fails on some previews (data: URLs)
function nav(next, replace) {
  view = next;
  if (!histOk) return;
  if (replace) { views[vIdx] = next; history.replaceState({ v: vIdx }, ''); }
  else { vIdx++; views.length = vIdx; views.push(next); history.pushState({ v: vIdx }, ''); }
}
function go(name, params = {}) { stopTimer(); nav(Object.assign({ name }, params)); render(true); }
function goBack() { if (vIdx > 0) history.back(); else go('home'); }
const quizRunning = () => view.name === 'play' && play && !play.finished && !play.abandoned;
window.addEventListener('popstate', e => {
  const i = e.state && typeof e.state.v === 'number' ? e.state.v : 0;
  if (quizRunning()) {
    // One stray swipe should not throw away a quiz in progress: ask for a second back first.
    if (Date.now() - backArmedAt > 3000) {
      backArmedAt = Date.now();
      history.pushState({ v: vIdx }, '');
      toast('Quay lại lần nữa để thoát bài đang làm.', 3000, true);
      return;
    }
    play.abandoned = true;
  }
  document.querySelectorAll('.overlay').forEach(o => o.remove()); // back closes an open dialog along with its screen
  stopTimer();
  vIdx = i;
  let next = views[i];
  // Entries from before a reload, or a quiz that was left, can't be shown again: fall back to the library.
  if (!next
    || (next.name === 'play' && (!play || play.finished || play.abandoned))
    || (next.name === 'result' && !(play && play.finished))) next = { name: 'home' };
  views[i] = view = next;
  render(true);
});

    !p.retry && hist ? h('p', { class: 'muted small num' }, `Cao nhất của bạn với bộ đề này: ${hist.best}% · ${hist.attempts} lần làm`) : null,
    p.kind === 'weak' ? h('p', { class: 'muted small num' }, weak.length
      ? `Còn ${weak.length} câu hay sai. Câu nào làm đúng ${MASTER_STREAK} lần liên tiếp sẽ ra khỏi danh sách.`
      : 'Bạn đã thuộc hết các câu hay sai của bộ đề này.') : null,
    h('div', { class: 'row' },
      missed.length ? btn(`Làm lại ${missed.length} câu sai${skipped ? ' và bỏ trống' : ''}`, () => startPlay(p.ref, missed.map(w => w.qi)), 'primary big') : null,
      weak.length ? btn(`Ôn ${weak.length} câu hay sai`, () => startPlay(p.ref, weak.map(x => x.i), 'weak'), missed.length ? 'big' : 'primary big') : null,
      btn('Làm lại từ đầu', () => startPlay(p.ref), missed.length || weak.length ? 'big' : 'primary big'),
      btn('Xem lịch sử', () => go('detail', { ref: p.ref }), 'ghost big'),
      btn('Về thư viện', () => go('home'), 'ghost big')));
  const parts = [head];
  const shown = view.showAll ? p.log : missed;
  const toggle = btn(view.showAll ? 'Chỉ hiện câu sai' : `Xem tất cả ${total} câu`, () => { view.showAll = !view.showAll; refresh(); }, 'ghost');
  parts.push(h('section', { class: 'stack' },
    h('div', { class: 'sec-head' }, h('h2', null, view.showAll ? `Toàn bộ bài làm (${total})` : `Các câu sai${skipped ? ' và bỏ trống' : ''} (${missed.length})`), toggle),
    h('p', { class: 'muted small' }, 'Màu xanh là đáp án đúng, màu đỏ là lựa chọn sai của bạn. Thứ tự A, B, C theo đề gốc.'),
    shown.length
      ? h('div', { class: 'qlist' }, shown.map(w => qItem(w.q, w.qi, {
          picked: w.chosen,
          note: w.skipped ? 'Bạn bỏ trống câu này.' : (w.ok ? 'Bạn làm đúng câu này.' : null),
          actions: canEdit(p.ref) ? btn('Sửa', () => openEdit(p.ref, w.qi, () => toast('Đã lưu câu hỏi')), 'ghost') : null })))
      : h('div', { class: 'note ok' }, h('b', null, 'Không sai câu nào. Tuyệt vời!'))));
  return h('div', { class: 'stack', style: 'gap:24px' }, parts);
}

/* ---------- Cloud sync: Google sign-in + Firestore (hosted version only) ---------- */
// The config is public by design; access is guarded by the Firestore rules (each user reads/writes only users/<uid>/...).
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyCdPMIxP56g-2BYx_3TU8S9ZdkmYbmznWA',
  authDomain: 'on-de-quiz.firebaseapp.com',
  projectId: 'on-de-quiz',
  storageBucket: 'on-de-quiz.firebasestorage.app',
  messagingSenderId: '795491404640',
  appId: '1:795491404640:web:8e41acf3014fed8316ac05'
};
const FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
// status: 'off' = not available here, 'loading', 'out' = signed out, 'in' = signed in
const cloud = { status: 'off', user: null, lastSync: 0, busy: false, error: '' };
let fb = null, syncTimer = 0, syncing = false, syncAgain = false, lastSyncedSig = '';

const syncSig = () => JSON.stringify([state.sets.map(s => [s.id, s.updatedAt || 0]), state.history, state.deleted]);
function scheduleSync() {
  if (cloud.status !== 'in') return;
  if (syncSig() === lastSyncedSig) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 1500);
}
async function initCloud() {
  const okHost = location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname);
  if (!okHost || window.claude) return; // file:// or inside Claude: stay local-only
  cloud.status = 'loading';
  try {
    const [appM, authM, fsM] = await Promise.all([import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-auth.js'), import(FB_SDK + 'firebase-firestore.js')]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    fb = { auth: authM.getAuth(app), db: fsM.getFirestore(app), A: authM, F: fsM };
    cloud.status = 'out';
    fb.A.onAuthStateChanged(fb.auth, u => {
      cloud.user = u ? { uid: u.uid, name: u.displayName || '', email: u.email || '', photo: u.photoURL || '' } : null;
      cloud.status = u ? 'in' : 'out';
      cloud.error = ''; lastSyncedSig = '';
      updateChrome();
      if (u) syncNow();
    });
    fb.A.getRedirectResult(fb.auth).catch(cloudError);
  } catch (e) {
    cloud.status = 'off';
    cloud.error = 'Không tải được phần đăng nhập. Kiểm tra mạng rồi tải lại trang.';
  }
  updateChrome();
}
async function signIn() {
  if (!fb) { toast(cloud.error || 'Phần đăng nhập đang tải, thử lại sau vài giây.'); return; }
  const provider = new fb.A.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try { await fb.A.signInWithPopup(fb.auth, provider); }
  catch (e) {
    const code = (e && e.code) || '';
    if (code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment') {
      try { await fb.A.signInWithRedirect(fb.auth, provider); } catch (e2) { cloudError(e2); }
    } else if (code !== 'auth/popup-closed-by-user' && code !== 'auth/cancelled-popup-request') cloudError(e);
  }
}
async function signOutCloud() {
  try { await fb.A.signOut(fb.auth); toast('Đã đăng xuất. Bộ đề vẫn còn trên máy này.'); } catch (e) { cloudError(e); }
}
function cloudError(e) {
  const code = (e && e.code) || '';
  cloud.error =
    code === 'auth/unauthorized-domain' ? 'Trang này chưa được phép đăng nhập. Thêm tên miền vào Firebase → Authentication → Settings → Authorized domains.'
    : code === 'permission-denied' ? 'Firestore từ chối ghi dữ liệu. Kiểm tra lại quy tắc bảo mật (tab Rules).'
    : code === 'auth/network-request-failed' || code === 'unavailable' ? 'Mất kết nối mạng. Dữ liệu vẫn lưu trên máy và sẽ đồng bộ khi có mạng.'
    : code === 'auth/web-storage-unsupported' || code === 'auth/internal-error' ? 'Trình duyệt này chặn đăng nhập (thường gặp khi mở trong Zalo/Messenger). Hãy mở link bằng Chrome hoặc Safari.'
    : 'Chưa đồng bộ được: ' + ((e && e.message) || 'lỗi không rõ');
  toast(cloud.error, 6000, true);
  updateChrome();
}
function mergeHistory(a, b) {
  const out = {};
  for (const id of new Set([...Object.keys(a || {}), ...Object.keys(b || {})])) {
    const x = (a || {})[id] || {}, y = (b || {})[id] || {};
    const seen = new Set();
    const runs = [...(x.runs || []), ...(y.runs || [])].filter(r => r && !seen.has(r.at) && seen.add(r.at)).sort((p, q) => q.at - p.at).slice(0, 30);
    const h1 = { best: Math.max(x.best || 0, y.best || 0), attempts: Math.max(x.attempts || 0, y.attempts || 0), runs };
    const qs = mergeQs(x.qs, y.qs);
    if (Object.keys(qs).length) h1.qs = qs;
    const latest = (x.lastAt || 0) >= (y.lastAt || 0) ? x : y;
    if (latest.last != null) h1.last = latest.last;
    if (latest.lastAt) h1.lastAt = latest.lastAt;
    out[id] = h1;
  }
  return out;
}
const toCloudSet = s => JSON.parse(JSON.stringify({ title: s.title || '', questions: s.questions || [], createdAt: s.createdAt || 0, updatedAt: s.updatedAt || 0, sample: !!s.sample }));
function fromCloudSet(id, d) {
  const questions = (Array.isArray(d.questions) ? d.questions : []).filter(q => q && typeof q.question === 'string' && Array.isArray(q.options) && Array.isArray(q.answer));
  return Object.assign({ id, title: String(d.title || 'Bộ đề chưa đặt tên'), questions, createdAt: d.createdAt || 0, updatedAt: d.updatedAt || 0 }, d.sample ? { sample: true } : {});
}
// Two-way merge: newest copy of each set wins, deletions win over older copies, history runs are unioned.
async function syncNow() {
  if (cloud.status !== 'in' || !fb) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; cloud.busy = true; updateChrome();
  const { F, db } = fb, uid = cloud.user.uid;
  const before = JSON.stringify([state.sets, state.history]);
  try {
    const setsCol = F.collection(db, 'users', uid, 'sets');
    const histRef = F.doc(db, 'users', uid, 'meta', 'history');
    const delRef = F.doc(db, 'users', uid, 'meta', 'deleted');
    const [snap, hs, ds] = await Promise.all([F.getDocs(setsCol), F.getDoc(histRef), F.getDoc(delRef)]);
    const remote = new Map(snap.docs.map(d => [d.id, fromCloudSet(d.id, d.data())]));
    const rDeleted = ds.exists() ? (ds.data().ids || {}) : {};
    const rHist = hs.exists() ? (hs.data().sets || {}) : {};

    const deleted = Object.assign({}, rDeleted);
    for (const [id, t] of Object.entries(state.deleted)) deleted[id] = Math.max(deleted[id] || 0, t);
    const local = new Map(state.sets.map(s => [s.id, s]));
    const merged = [];
    for (const id of new Set([...local.keys(), ...remote.keys()])) {
      const l = local.get(id), r = remote.get(id);
      const pick = !l ? r : !r ? l : ((r.updatedAt || 0) > (l.updatedAt || 0) ? r : l);
      if (deleted[id] && deleted[id] >= (pick.updatedAt || 0)) continue;
      merged.push(pick);
    }
    merged.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const hist = mergeHistory(state.history, rHist);
    for (const id of Object.keys(hist)) if (deleted[id] && !merged.some(s => s.id === id)) delete hist[id];

    state.sets = merged; state.history = hist; state.deleted = deleted;
    saveLocal();

    const writes = [];
    for (const s of merged) { const r = remote.get(s.id); if (!r || (r.updatedAt || 0) !== (s.updatedAt || 0)) writes.push(b => b.set(F.doc(setsCol, s.id), toCloudSet(s))); }
    for (const id of remote.keys()) if (!merged.some(s => s.id === id)) writes.push(b => b.delete(F.doc(setsCol, id)));
    if (JSON.stringify(hist) !== JSON.stringify(rHist)) writes.push(b => b.set(histRef, { sets: JSON.parse(JSON.stringify(hist)) }));
    if (JSON.stringify(deleted) !== JSON.stringify(rDeleted)) writes.push(b => b.set(delRef, { ids: deleted }));
    for (let k = 0; k < writes.length; k += 400) {
      const batch = F.writeBatch(db);
      writes.slice(k, k + 400).forEach(w => w(batch));
      await batch.commit();
    }
    cloud.lastSync = Date.now(); cloud.error = '';
    lastSyncedSig = syncSig();
  } catch (e) {
    const big = e && /exceeds the maximum allowed size|larger than/i.test(e.message || '');
    if (big) { cloud.error = 'Có bộ đề quá lớn để lưu lên mạng (giới hạn khoảng 1 MB mỗi bộ). Hãy tách thành nhiều bộ nhỏ hơn.'; toast(cloud.error, 6000, true); }
    else cloudError(e);
  } finally {
    syncing = false; cloud.busy = false;
    const changed = JSON.stringify([state.sets, state.history]) !== before;
    if (changed && view.name !== 'play') refresh(); else updateChrome();
    if (syncAgain) { syncAgain = false; scheduleSync(); }
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && cloud.status === 'in' && Date.now() - cloud.lastSync > 60000 && view.name !== 'play') syncNow();
});
function accountChip() {
  const u = cloud.user;
  const dot = cloud.busy ? 'busy' : cloud.error ? 'err' : '';
  const label = cloud.busy ? 'Đang đồng bộ…' : cloud.error ? 'Lỗi đồng bộ' : 'Đã đồng bộ';
  const av = u.photo ? h('img', { src: u.photo, alt: '', referrerpolicy: 'no-referrer' }) : h('span', { class: 'av' }, (u.name || u.email || '?').trim().charAt(0).toUpperCase());
  return h('button', { type: 'button', class: 'acct', onclick: openAccount, title: u.email }, av, h('span', { class: 'dot ' + dot }), h('span', { class: 'acct-l' }, label));
}
function openAccount() {
  const u = cloud.user; if (!u) return;
  const when = cloud.lastSync ? new Date(cloud.lastSync).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' }) : 'chưa';
  const close = openModal(
    h('h2', null, 'Tài khoản'),
    h('div', { class: 'stack', style: 'gap:4px' }, h('b', null, u.name || 'Không có tên'), h('span', { class: 'muted' }, u.email)),
    h('p', { class: 'muted small' }, `Lần đồng bộ gần nhất: ${when}. Bộ đề và lịch sử làm bài được lưu lên mạng theo tài khoản này, đăng nhập ở máy khác là thấy.`),
    cloud.error ? h('div', { class: 'note bad' }, h('span', null, cloud.error)) : null,
    h('div', { class: 'row' },
      btn('Đồng bộ ngay', () => { close(); syncNow(); }, 'primary'),
      btn('Đăng xuất', () => { close(); signOutCloud(); }),
      btn('Đóng', () => close(), 'ghost')),
    h('p', { class: 'muted small' }, 'Đăng xuất không xóa dữ liệu trên máy này. Nếu đang dùng máy của người khác, hãy xóa bộ đề trước khi đăng xuất.'));
}

// One-time cleanup of LaTeX left in sets saved before this version.
if (state.pendingClean) {
  delete state.pendingClean;
  let fixed = 0;
  if (!state.latexCleaned) {
    for (const set of state.sets) set.questions = set.questions.map(q => { const c = cleanQuestion(q); if (JSON.stringify(c) !== JSON.stringify(q)) fixed++; return c; });
    state.latexCleaned = true;
    save();
  }
  if (fixed) setTimeout(() => toast(`Đã dọn ký hiệu LaTeX trong ${fixed} câu hỏi đã lưu.`, 4000), 300);
}
render(true);
initCloud();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
